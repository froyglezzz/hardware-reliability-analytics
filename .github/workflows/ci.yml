name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest scripts_analysis/tests/ -v \
            --cov=scripts_analysis \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  cpp-build:
    name: C++17 build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get install -y cmake g++ ninja-build

      - name: Configure CMake
        run: |
          cmake -B hardware_monitor/build \
                -S hardware_monitor \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja

      - name: Build
        run: cmake --build hardware_monitor/build --parallel

      - name: Smoke test (1 second)
        run: hardware_monitor/build/thermal_monitor 1
